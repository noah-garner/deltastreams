bundle:
  name: deltastreams

variables:
  schema_name:
    description: Target schema for Unity Catalog
    default: dev
  rp_bootstrap_servers:
    description: Redpanda Cloud bootstrap connection string
  rp_user:
    description: Redpanda Cloud username
  rp_password:
    description: Redpanda Cloud password

targets:
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  schemas:
    default_schema:
      name: "${var.schema_name}"
      catalog_name: main

  volumes:
    udp_stream_volume:
      name: udp_stream_volume
      catalog_name: main
      schema_name: "${var.schema_name}"
      volume_type: MANAGED

  jobs:
    udp_stream_pipeline:
      name: "[${bundle.environment}] UDP Stream Pipeline"
      tasks:
        - task_key: run_kafka_bronze_ingestion
          environment_key: "default"
          spark_python_task:
            python_file: src/01_bronze_kafka_ingest.py
            parameters:
              - "--bootstrap_servers"
              - "${var.rp_bootstrap_servers}"
              - "--topic"
              - "network-telemetry"
              - "--checkpoint_path"
              - "/Volumes/main/${resources.schemas.default_schema.name}/udp_stream_volume/checkpoints/kafka_bronze"
              - "--target_table"
              - "main.${resources.schemas.default_schema.name}.kafka_bronze_clickstream"
              - "--format_type"
              - "cloudFiles"
              - "--sasl_user"
              - "${var.rp_user}"
              - "--sasl_password"
              - "${var.rp_password}"

        - task_key: run_kafka_silver_cleansing
          depends_on:
            - task_key: run_kafka_bronze_ingestion
          environment_key: "default"
          spark_python_task:
            python_file: "src/02_silver_kafka_cleansing.py"
            parameters:
              - "--source_table"
              - "main.${resources.schemas.default_schema.name}.kafka_bronze_clickstream"
              - "--silver_table"
              - "main.${resources.schemas.default_schema.name}.kafka_silver_clean"
              - "--dlq_table"
              - "main.${resources.schemas.default_schema.name}.kafka_silver_dlq"
              - "--checkpoint_path"
              - "/Volumes/main/${resources.schemas.default_schema.name}/udp_stream_volume/checkpoints/kafka_silver"

        - task_key: run_kafka_gold_analysis
          depends_on:
            - task_key: run_kafka_silver_cleansing
          environment_key: "default"
          spark_python_task:
            python_file: "src/03_gold_security_alerts.py"
            parameters:
              - "--source_table"
              - "main.${resources.schemas.default_schema.name}.kafka_silver_clean"
              - "--gold_table"
              - "main.${resources.schemas.default_schema.name}.kafka_gold_security_alerts"
              - "--checkpoint_path"
              - "/Volumes/main/${resources.schemas.default_schema.name}/udp_stream_volume/checkpoints/kafka_gold"

      environments:
        - environment_key: default
          spec:
            environment_version: "1"
