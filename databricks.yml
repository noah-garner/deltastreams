bundle:
  name: deltastreams

variables:
  # Required by DABs at the top level for reference by targets
  schema_name:
    description: Target schema for Unity Catalog
    default: dev
  rp_bootstrap_servers:
    description: Redpanda Cloud bootstrap connection string
    default: "dba14vv73u5jpihrnbug.any.us-west-2.mpx.prd.cloud.redpanda.com:9092"
  stream_status:
    description: "Continuous trigger status"
    default: "PAUSED"

targets:
  security:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_name: "dev_security"
    resources:
      jobs:
        build_geoip_dimension: {}
        udp_batch_pipeline: {}
        udp_stream_pipeline: {}

  finance:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_name: "dev_finance"
    resources:
      jobs:
        finance_stream_pipeline: {}

include:
  - bundle_configs/security_jobs.yml
  - bundle_configs/finance_jobs.yml