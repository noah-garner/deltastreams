[project]
name = "fluid"
version = "0.1.0"
description = "Real-time honeypot security telemetry stream data pipeline built with Vector, Redpanda, and Databricks"
requires-python = ">=3.10,<3.12"
dependencies = [
    "ipykernel>=6.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "websocket-client>=1.9.2",
    "polars>=2.0.0",
    "kafka-python>=3.0.12",
    "duckdb>=1.5.6",
    "scikit-learn>=1.7.2",
    "streamlit>=1.65.0",
    "plotly>=7.1.0",
]
