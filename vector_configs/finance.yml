data_dir: "./data/vector"

sources:
  market_telemetry_in:
    type: "file"
    include: ["./data/market.log"]
    read_from: "beginning"

sinks:
  kafka_out:
    type: "kafka"
    inputs: ["market_telemetry_in"]
    bootstrap_servers: "localhost:19092"
    topic: "liquidity_transactions"
    encoding:
      codec: "json"