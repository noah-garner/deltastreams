version: '3.8'

services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: docker-kafka-1
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"

  vector:
    image: timberio/vector:0.34.2-alpine
    container_name: docker-vector-1
    depends_on:
      - kafka
    ports:
      - "5140:5140/udp"
      - "8686:8686"
    volumes:
      - ./vector.yml:/etc/vector/vector.yaml:ro
