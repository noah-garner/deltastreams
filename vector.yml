data_dir: "/var/lib/vector"

sources:
  telemetry_in:
    type: "file"
    include:
      - "/var/log/auth.log"
    read_from: "beginning"

sinks:
  kafka_out:
    type: "kafka"
    inputs: ["telemetry_in"]
    bootstrap_servers: "dba14vv73u5jpihrnbug.any.us-west-2.mpx.prd.cloud.redpanda.com:9092"
    topic: "network-telemetry"
    encoding:
      codec: "json"
    tls:
      enabled: true
    sasl:
      enabled: true
      mechanism: "SCRAM-SHA-256"
      username: "${RP_USER}"
      password: "${RP_PASSWORD}"

api:
  enabled: true
  address: "0.0.0.0:8686"
